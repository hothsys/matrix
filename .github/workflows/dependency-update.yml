name: Dependency Update Check

on:
  schedule:
    - cron: '0 9 * * 1'  # Weekly on Monday at 9am UTC
  workflow_dispatch:       # Manual trigger

jobs:
  check-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Check for dependency updates
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const deps = JSON.parse(fs.readFileSync('dependencies.json', 'utf8'));
            const updates = [];

            for (const dep of deps.vendor) {
              if (dep.registry !== 'npm') continue;

              const resp = await fetch(`https://registry.npmjs.org/${dep.name}`);
              if (!resp.ok) {
                console.log(`Failed to fetch ${dep.name}: ${resp.status}`);
                continue;
              }
              const data = await resp.json();
              const currentMajor = dep.version.split('.')[0];

              // Find latest version in the same major range
              const versions = Object.keys(data.versions || {})
                .filter(v => !v.includes('-') && v.startsWith(currentMajor + '.'))
                .sort((a, b) => {
                  const pa = a.split('.').map(Number);
                  const pb = b.split('.').map(Number);
                  for (let i = 0; i < 3; i++) {
                    if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) - (pb[i] || 0);
                  }
                  return 0;
                });

              const latest = versions[versions.length - 1];
              if (latest && latest !== dep.version) {
                updates.push({ name: dep.name, from: dep.version, to: latest });
                dep.version = latest;
              } else {
                console.log(`${dep.name}: v${dep.version} is up to date`);
              }
            }

            if (!updates.length) {
              console.log('All dependencies are up to date.');
              return;
            }

            // Write updated dependencies.json
            fs.writeFileSync('dependencies.json', JSON.stringify(deps, null, 2) + '\n');

            // Delete old vendor files so serve.py re-downloads
            for (const u of updates) {
              const dep = deps.vendor.find(d => d.name === u.name);
              for (const filename of Object.keys(dep.files)) {
                const path = `vendor/${filename}`;
                if (fs.existsSync(path)) {
                  fs.unlinkSync(path);
                  console.log(`Deleted ${path} for re-download`);
                }
              }
            }

            // Create PR
            const branch = `deps/update-${Date.now()}`;
            const title = updates.map(u => `${u.name} ${u.from} → ${u.to}`).join(', ');

            const { execSync } = require('child_process');
            execSync(`git config user.name "github-actions[bot]"`);
            execSync(`git config user.email "github-actions[bot]@users.noreply.github.com"`);
            execSync(`git checkout -b ${branch}`);
            execSync(`git add dependencies.json`);
            execSync(`git add -u vendor/`);
            execSync(`git commit -m "deps: ${title}"`);
            execSync(`git push origin ${branch}`);

            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Dependency update: ${title}`,
              head: branch,
              base: 'main',
              body: [
                '## Dependency Updates',
                '',
                '| Package | From | To |',
                '|---|---|---|',
                ...updates.map(u => `| ${u.name} | ${u.from} | ${u.to} |`),
                '',
                'Vendor files deleted — `serve.py` will re-download on next start.',
                '',
                'Auto-generated by the dependency update workflow.',
              ].join('\n'),
            });

            console.log(`PR created for: ${title}`);
